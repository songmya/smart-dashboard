<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Disk Health Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div>
      <h1>硬盘健康趋势</h1>
      <p id="subtitle">读取 SMART 历史 CSV，自动加载新数据</p>
    </div>
    <div class="toolbar">
      <label>指标
        <select id="metric">
          <option value="temp_c">温度 °C</option>
          <option value="power_on_hours">通电小时</option>
          <option value="udma_crc_errors">UDMA CRC 错误</option>
          <option value="ata_error_count">ATA 错误</option>
          <option value="command_timeout">Command Timeout</option>
          <option value="reallocated_sectors">重映射扇区</option>
          <option value="pending_sectors">待映射扇区</option>
          <option value="offline_uncorrectable">离线不可校正</option>
          <option value="power_cycle_count">通电次数</option>
        </select>
      </label>
      <button id="runCheck">一键检测</button>
      <button id="refresh">立即刷新</button>
      <span id="status" class="status">连接中…</span>
    </div>
  </header>

  <main>
    <section id="cards" class="cards"></section>

    <section class="panel check-panel" id="checkPanel" hidden>
      <div class="panel-head">
        <h2>硬盘检测</h2>
        <span id="checkState" class="hint">准备中…</span>
      </div>
      <pre id="checkLog"></pre>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 id="chartTitle">趋势图</h2>
        <span class="hint">新 CSV 写入后会通过 SSE 自动刷新；失败时 15 秒轮询兜底。</span>
      </div>
      <div class="chart-wrap"><canvas id="trend"></canvas></div>
    </section>

    <section class="grid">
      <div class="panel">
        <h2>最近记录</h2>
        <div class="table-wrap"><table id="latestTable"></table></div>
      </div>
      <div class="panel">
        <h2>风险变化</h2>
        <div id="risks" class="risks"></div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
